# Run Framekit from local instead of the published npm package.
[mcp_servers.framekit-local]
command = "pnpm"
args = ["run", "framekit", "--", "mcp", "--editor", "final-cut-live"]

[mcp_servers.framekit-local.env]
FRAMEKIT_EDITOR = "final-cut-live"
FRAMEKIT_FINAL_CUT_CANONICAL_PROVIDER = "native"
FRAMEKIT_FINAL_CUT_NATIVE_WRITES = "1"
FRAMEKIT_FINAL_CUT_HEADLESS = "0"
FRAMEKIT_AUTO_CONNECT = "0"
