name: Published package consumer minimum
description: Build and exercise the package on the minimum supported Node.js version.
inputs:
  node-version:
    description: Contributor Node.js version used to build the package.
    required: true
  consumer-node-version:
    description: Minimum supported consumer Node.js version.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/action/setup
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build the package
      shell: bash
      run: pnpm run build:package

    - name: Pack the built package
      shell: bash
      run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

    - name: Set up the consumer minimum Node.js version
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.consumer-node-version }}

    - name: Install and exercise the package on the consumer minimum
      shell: bash
      run: |
        mkdir "$RUNNER_TEMP/consumer"
        cd "$RUNNER_TEMP/consumer"
        npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/morshoto-framekit-*.tgz
        cp "$GITHUB_WORKSPACE/scripts/consumer-runtime-smoke.mjs" .
        node consumer-runtime-smoke.mjs
