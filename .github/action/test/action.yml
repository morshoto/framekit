name: Fast unit and integration checks
description: Run unit, contract, and critical integration tests for pull requests.
inputs:
  node-version:
    description: Contributor Node.js version.
    required: true
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install FFmpeg fixture toolchain
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

    - name: Run fast tests
      shell: bash
      run: pnpm run test:fast
