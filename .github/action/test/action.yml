name: Unit and integration checks
description: Run fast local, complete deterministic PR, or full Security validation.
inputs:
  node-version:
    description: Contributor Node.js version.
    required: true
  validation-level:
    description: Select fast, deterministic, or full Security validation.
    required: false
    default: full
runs:
  using: composite
  steps:
    - uses: ./.github/action/setup
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install FFmpeg fixture toolchain
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

    - name: Validate test mode
      shell: bash
      env:
        VALIDATION_LEVEL: ${{ inputs.validation-level }}
      run: |
        if [[ "$VALIDATION_LEVEL" != "fast" && "$VALIDATION_LEVEL" != "deterministic" && "$VALIDATION_LEVEL" != "full" ]]; then
          echo "Unsupported validation level: $VALIDATION_LEVEL" >&2
          exit 1
        fi

    - name: Run fast tests
      if: ${{ inputs.validation-level == 'fast' }}
      shell: bash
      run: pnpm run test:fast

    - name: Validate clean Codex plugin installation
      if: ${{ inputs.validation-level == 'full' }}
      shell: bash
      run: pnpm run test:codex-plugin

    - name: Run unit and integration tests
      if: ${{ inputs.validation-level != 'fast' }}
      shell: bash
      env:
        FRAMEKIT_TEST_REPORT_DIR: artifacts/test-results
        FRAMEKIT_HEADLESS_RELEASE_GATE_EVIDENCE_DIR: artifacts/headless-release-gate/${{ github.run_id }}
        FRAMEKIT_HEADLESS_RELEASE_GATE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: pnpm run test

    - name: Upload deterministic test results
      if: ${{ always() && inputs.validation-level != 'fast' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: deterministic-tests-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/test-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Validate skill tool metadata against tools/list
      shell: bash
      run: pnpm run check:skill-tools

    - name: Upload v0.1.15 headless release-gate evidence
      if: ${{ always() && inputs.validation-level != 'fast' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: headless-release-gate-${{ github.run_id }}
        path: artifacts/headless-release-gate/${{ github.run_id }}
        if-no-files-found: warn

    - name: Run Basic Final Cut Editing MVP gate
      if: ${{ always() && inputs.validation-level == 'full' }}
      shell: bash
      run: pnpm exec tsx --test tests/workflows/basic-editing/basic-editing-mvp.test.ts

    - name: Run deterministic MCP evaluation
      if: ${{ inputs.validation-level == 'full' }}
      shell: bash
      run: pnpm run evaluate

    - name: Run filler-removal benchmark
      if: ${{ inputs.validation-level == 'full' }}
      shell: bash
      run: pnpm run benchmark:filler-removal --output-dir artifacts/filler-removal/${{ github.run_id }}

    - name: Upload filler-removal benchmark evidence
      if: ${{ always() && inputs.validation-level == 'full' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: filler-removal-benchmark-${{ github.run_id }}
        path: artifacts/filler-removal/${{ github.run_id }}
        if-no-files-found: warn

    - name: Run v0.1.6 native-editing release gate
      if: ${{ inputs.validation-level == 'full' }}
      shell: bash
      run: pnpm run release-gate --output-dir artifacts/release-gate/${{ github.run_id }}

    - name: Upload release gate evidence
      if: ${{ always() && inputs.validation-level == 'full' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-gate-${{ github.run_id }}
        path: artifacts/release-gate/${{ github.run_id }}
        if-no-files-found: warn
