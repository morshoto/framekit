name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/action/setup
        with:
          node-version: 22.23.5
      - name: Install FFmpeg fixture toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Run suspected test in isolation
        timeout-minutes: 3
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/test-results/v8-focused
          FRAMEKIT_TEST_REPORT_DIR: artifacts/test-results-focused
          FRAMEKIT_HEADLESS_RELEASE_GATE_EVIDENCE_DIR: artifacts/headless-release-gate/${{ github.run_id }}
          FRAMEKIT_HEADLESS_RELEASE_GATE_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          ( while sleep 30; do
              echo 'Diagnostic process snapshot:'
              ps -eo pid,ppid,etime,stat,rss,vsz,comm | grep -E '(^ *PID|node|pnpm|ffmpeg|ffprobe)' || true
              find /tmp -type f -path '*/.framekit-render-*/render.mp4' -printf '%s %p\n' | head -20
            done ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          pnpm test --file tests/adapters/headless/headless-renderer.test.ts --test-name-pattern 'FFmpeg renderer fills a trailing video gap with black while music continues'
      - name: Stress trailing-gap render concurrently
        timeout-minutes: 8
        run: |
          mkdir -p /tmp/framekit-stress
          printf '%s\n' '#!/bin/bash' 'args=("$@"); for i in "${!args[@]}"; do args[$i]="${args[$i]//normalize=0,apad,atrim=duration=/normalize=0,atrim=duration=}"; done; exec /usr/bin/ffmpeg "${args[@]}"' > /tmp/framekit-stress/ffmpeg-no-mix-apad
          chmod +x /tmp/framekit-stress/ffmpeg-no-mix-apad
          ( while sleep 10; do
              echo 'Stress process snapshot:'
              ps -eo pid,ppid,etime,stat,rss,vsz,comm | grep -E '(^ *PID|node|ffmpeg|ffprobe)' || true
              df -h /tmp
              find /tmp/framekit-stress -type f -path '*/.framekit-render-*/render.mp4' -printf '%s %p\n' | head -20
            done ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          seq 1 64 | xargs -P 8 -I '{}' bash -c '
            i="$1"
            mkdir -p "/tmp/framekit-stress/$i/tmp"
            FFMPEG_BIN=/tmp/framekit-stress/ffmpeg-no-mix-apad TMPDIR="/tmp/framekit-stress/$i/tmp" timeout --kill-after=5s 50s node --import tsx --test --test-name-pattern="FFmpeg renderer fills a trailing video gap with black while music continues" tests/adapters/headless/headless-renderer.test.ts > "/tmp/framekit-stress/$i/output.log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then echo "stress $i failed status=$status"; cat "/tmp/framekit-stress/$i/output.log"; exit "$status"; fi
            echo "stress $i passed"
          ' _ '{}'
      - name: Run complete suite with process snapshots
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/test-results/v8
          FRAMEKIT_TEST_REPORT_DIR: artifacts/test-results
          FRAMEKIT_HEADLESS_RELEASE_GATE_EVIDENCE_DIR: artifacts/headless-release-gate/${{ github.run_id }}
          FRAMEKIT_HEADLESS_RELEASE_GATE_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git show 6c1daf33c23bccf6c4e286cbc1369e2351f0834b:.github/workflows/ci.yml > .github/workflows/ci.yml
          ( while sleep 30; do
              echo 'Diagnostic process snapshot:'
              ps -eo pid,ppid,etime,stat,rss,vsz,comm | grep -E '(^ *PID|node|pnpm|ffmpeg|ffprobe)' || true
              find /tmp -type f -path '*/.framekit-render-*/render.mp4' -printf '%s %p\n' | head -20
            done ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          pnpm run test
