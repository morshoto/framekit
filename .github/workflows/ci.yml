name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0
  CONSUMER_NODE_VERSION: 20.0.0

jobs:
  lint:
    name: Lint / static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run lint and static checks
        uses: ./.github/action/lint-static
        with:
          node-version: ${{ env.NODE_VERSION }}

  test:
    name: Unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit and integration checks
        uses: ./.github/action/test
        with:
          node-version: ${{ env.NODE_VERSION }}
          validation-level: fast

  docs-foundation:
    name: Docs static export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @framekit/docs typecheck
      - name: Test root export
        run: |
          pnpm --filter @framekit/docs build
          pnpm --filter @framekit/docs test:export
      - name: Test project-path export
        env:
          DOCS_BASE_PATH: /framekit
        run: |
          pnpm --filter @framekit/docs build
          pnpm --filter @framekit/docs test:export
      - name: Upload project-path export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-static-export
          path: apps/docs/out
          retention-days: 7

  nix-fixture:
    name: Linux Nix fixture bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install, build and smoke the fixture profile
        run: |
          nix develop ./nix --command bash -c '
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm run build
            pnpm run test:fixtures
            pnpm run framekit -- doctor dev --profile fixture --json
            pnpm run smoke:fixture-mcp
          '

  consumer-runtime:
    name: Published package consumer minimum
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the published package consumer minimum
        uses: ./.github/action/consumer-runtime
        with:
          node-version: ${{ env.NODE_VERSION }}
          consumer-node-version: ${{ env.CONSUMER_NODE_VERSION }}

  swift:
    name: Swift type-check
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Swift Workflow Extension
        uses: ./.github/action/swift
