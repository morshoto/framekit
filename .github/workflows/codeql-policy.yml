name: CodeQL Policy Gate

on:
    workflow_run:
        workflows:
            - CodeQL
        types:
            - completed

permissions:
    actions: read
    checks: write
    contents: read
    pull-requests: read
    security-events: read

concurrency:
    group: codeql-policy-${{ github.event.workflow_run.id }}
    cancel-in-progress: false

jobs:
    verify:
        name: CodeQL policy gate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # workflow_run executes this workflow from the default branch. Do not check out PR code.
            - name: Check out trusted policy
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Verify CodeQL results
              run: node .github/codeql/verify-policy.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
