name: CodeQL

on:
    push:
        branches:
            - main
    # pull_request:
    #   branches:
    #     - main
    #   types:
    #     - opened
    #     - synchronize
    #     - reopened
    schedule:
        - cron: '30 1 * * 0'
    workflow_dispatch:
        inputs:
            profile_swift:
                description: Benchmark the Swift compiler without and with CodeQL extraction
                required: false
                type: boolean
                default: false

permissions:
    contents: read
    security-events: write
    actions: read

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    # Keep active default-branch scans intact; supersede stale PR scans.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        # Always publish the required JavaScript/TypeScript check, including for documentation-only PRs.
        if: ${{ !cancelled() }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                      os: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:${{ matrix.language }}
                  # Do not block the required check on delayed SARIF processing.
                  wait-for-processing: false

    analyze-swift:
        name: Analyze (swift)
        # Always publish the configured Swift category so code-scanning comparison
        # has a result even when the pull request changes no Swift source.
        if: ${{ !cancelled() }}
        runs-on: macos-26
        timeout-minutes: 40

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Capture Swift profiling environment
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_swift }}
              run: |
                  uname -a
                  xcodebuild -version
                  xcrun --sdk macosx --show-sdk-version
                  git rev-parse HEAD

            # Before CodeQL init, no extractor/tracing environment has been installed.
            # Compare this with the same script after init in the next type-check step.
            - name: Benchmark Swift compiler without CodeQL tracing
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_swift }}
              run: bash .github/codeql/typecheck-swift.sh

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: swift
                  build-mode: manual

            - name: Type-check Swift sources for CodeQL extraction
              timeout-minutes: 25
              run: bash .github/codeql/typecheck-swift.sh

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:swift
