name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Keep active default-branch scans intact; supersede stale PR scans.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect CodeQL paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript_typescript: ${{ steps.filter.outputs.javascript_typescript }}
      swift: ${{ steps.filter.outputs.swift }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine affected languages
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo 'javascript_typescript=true'
              echo 'swift=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA...$CURRENT_SHA")"
          printf '%s\n' "$changed"

          javascript_pattern='(^|/)[^/]+\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$|(^|/)(package\.json|pnpm-lock\.yaml|tsconfig[^/]*\.json)$|^\.github/(codeql/|workflows/codeql\.yml$)'
          swift_pattern='^adapters/final-cut/swift-bridge/|^\.github/(codeql/|workflows/codeql\.yml$)'

          if printf '%s\n' "$changed" | grep -Eq "$javascript_pattern"; then
            javascript_typescript=true
          else
            javascript_typescript=false
          fi

          if printf '%s\n' "$changed" | grep -Eq "$swift_pattern"; then
            swift=true
          else
            swift=false
          fi

          {
            echo "javascript_typescript=$javascript_typescript"
            echo "swift=$swift"
          } >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # A detector failure must fail open to a full scan, not skip a required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.javascript_typescript == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    # Keep the required check present; skip its work inside the job when Swift is unchanged.
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Skip Swift CodeQL analysis (no Swift changes)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.swift != 'true' }}
        run: echo "No Swift-related files changed; skipping Swift CodeQL analysis."

      - name: Check out repository
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.swift == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.swift == 'true' }}
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Type-check Swift sources for CodeQL extraction
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.swift == 'true' }}
        timeout-minutes: 25
        run: |
          xcrun --sdk macosx swiftc \
            -typecheck \
            -parse-as-library \
            -module-name FramekitFinalCutWorkflowCodeQL \
            -target "$(uname -m)-apple-macos15.0" \
            -swift-version 5 \
            -D FRAMEKIT_CODEQL \
            adapters/final-cut/swift-bridge/FinalCutWorkflowExtension/FinalCutLiveWorkflowExtension.swift \
            .github/codeql/FinalCutWorkflowExtensionShim.swift

      - name: Analyze with CodeQL
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.swift == 'true' }}
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:swift
