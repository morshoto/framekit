name: CodeQL

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    workflow_call:
        inputs:
            swift_only:
                type: boolean
                default: false
            scan_ref:
                type: string
                default: ''
            scan_sha:
                type: string
                default: ''
            profile_swift:
                type: boolean
                default: false

permissions:
    contents: read
    security-events: write
    actions: read
    pull-requests: read

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    # Only PR runs share a group; main and release scans must not cancel each other.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    detect-changes:
        name: Detect CodeQL scope
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            run_codeql: ${{ steps.scope.outputs.run_codeql || steps.full.outputs.run_codeql }}
            swift: ${{ steps.scope.outputs.swift || steps.full.outputs.swift }}
        steps:
            - name: Check out repository
              if: ${{ github.event_name == 'pull_request' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Detect PR readiness
              if: ${{ github.event_name == 'pull_request' }}
              id: scope
              run: node .github/codeql/detect-changes.mjs
              env:
                  PR_DRAFT: ${{ github.event.pull_request.draft }}

            - name: Select full security scan
              if: ${{ github.event_name != 'pull_request' }}
              id: full
              run: |
                  echo 'run_codeql=true' >> "$GITHUB_OUTPUT"
                  echo 'swift=true' >> "$GITHUB_OUTPUT"

    analyze:
        name: Analyze (${{ matrix.language }})
        # Publish JavaScript/TypeScript results for every ready PR and normal full-scan event.
        needs: detect-changes
        if: ${{ needs.detect-changes.outputs.run_codeql == 'true' && inputs.swift_only != true }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                      os: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.scan_sha || github.sha }}
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:${{ matrix.language }}
                  wait-for-processing: true

    analyze-swift:
        name: Analyze (swift)
        # Swift is scanned by Security and release workflows after PR merge.
        needs: detect-changes
        if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.run_codeql == 'true' && needs.detect-changes.outputs.swift == 'true' }}
        runs-on: macos-26
        timeout-minutes: 40

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.scan_sha || github.sha }}
                  persist-credentials: false

            - name: Verify requested release commit
              if: ${{ inputs.scan_sha != '' }}
              env:
                  EXPECTED_SHA: ${{ inputs.scan_sha }}
              run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            - name: Capture Swift profiling environment
              if: ${{ inputs.profile_swift }}
              run: |
                  uname -a
                  xcodebuild -version
                  xcrun --sdk macosx --show-sdk-version
                  git rev-parse HEAD

            # Before CodeQL init, no extractor/tracing environment has been installed.
            # Compare this with the same script after init in the next type-check step.
            - name: Benchmark Swift compiler without CodeQL tracing
              if: ${{ inputs.profile_swift }}
              run: bash .github/codeql/typecheck-swift.sh

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: swift
                  build-mode: manual

            - name: Type-check Swift sources for CodeQL extraction
              timeout-minutes: 25
              run: bash .github/codeql/typecheck-swift.sh

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:swift
                  wait-for-processing: true
                  ref: ${{ inputs.scan_ref || github.ref }}
                  sha: ${{ inputs.scan_sha || github.sha }}
