name: CodeQL

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    schedule:
        - cron: '30 1 * * 0'
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    # Keep active default-branch scans intact; supersede stale PR scans.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    detect-changes:
        name: Detect CodeQL scope
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run_codeql: ${{ steps.scope.outputs.run_codeql }}
            swift: ${{ steps.scope.outputs.swift }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Detect changed files and PR readiness
              id: scope
              run: node .github/codeql/detect-changes.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_DRAFT: ${{ github.event.pull_request.draft }}
                  PUSH_BEFORE: ${{ github.event.before }}

    analyze:
        name: Analyze (${{ matrix.language }})
        # Publish JavaScript/TypeScript results for every ready PR and normal full-scan event.
        needs: detect-changes
        if: ${{ needs.detect-changes.outputs.run_codeql == 'true' }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                      os: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:${{ matrix.language }}
                  # Do not block the required check on delayed SARIF processing.
                  wait-for-processing: false

    analyze-swift:
        name: Analyze (swift)
        # Skip the expensive macOS scan on PRs and pushes without Swift inputs.
        # Manual and weekly scans still cover Swift unconditionally.
        needs: detect-changes
        if: ${{ needs.detect-changes.outputs.run_codeql == 'true' && needs.detect-changes.outputs.swift == 'true' }}
        runs-on: macos-26
        timeout-minutes: 40

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: swift
                  build-mode: manual

            - name: Type-check Swift sources for CodeQL extraction
              timeout-minutes: 25
              run: |
                  xcrun --sdk macosx swiftc \
                    -typecheck \
                    -parse-as-library \
                    -module-name FramekitFinalCutWorkflowCodeQL \
                    -target "$(uname -m)-apple-macos15.0" \
                    -swift-version 5 \
                    -D FRAMEKIT_CODEQL \
                    adapters/final-cut/swift-bridge/FinalCutWorkflowExtension/FinalCutLiveWorkflowExtension.swift \
                    .github/codeql/FinalCutWorkflowExtensionShim.swift

            - name: Analyze with CodeQL
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:swift
