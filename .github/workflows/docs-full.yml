name: Docs full validation

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-full-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.5

jobs:
  docs-foundation:
    name: Docs static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @framekit/docs typecheck
      - run: pnpm --filter @framekit/docs test
      - run: pnpm --filter @framekit/docs build-storybook
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm --filter @framekit/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @framekit/docs test:stories
      - name: Upload Storybook screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-storybook-screenshots
          path: apps/docs/artifacts/storybook
          if-no-files-found: ignore
          retention-days: 7
      - name: Test root export
        run: |
          pnpm --filter @framekit/docs build
          pnpm --filter @framekit/docs test:export
          pnpm --filter @framekit/docs test:shell
          pnpm --filter @framekit/docs test:locales
          pnpm --filter @framekit/docs test:search
      - name: Upload search screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-search-screenshots
          path: apps/docs/artifacts/search
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload locale screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-locale-screenshots
          path: apps/docs/artifacts/locales
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload shell screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-shell-screenshots
          path: apps/docs/artifacts/shell
          if-no-files-found: ignore
          retention-days: 7
      - name: Test project-path export
        env:
          DOCS_BASE_PATH: /framekit
        run: |
          pnpm --filter @framekit/docs build
          pnpm --filter @framekit/docs test:export
          pnpm --filter @framekit/docs test:locales
          pnpm --filter @framekit/docs test:search
      - name: Upload project-path export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-static-export
          path: apps/docs/out
          retention-days: 7

  docs-e2e:
    name: Docs E2E (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: root
            base_path: ''
          - profile: project
            base_path: /framekit
    env:
      DOCS_BASE_PATH: ${{ matrix.base_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        timeout-minutes: 8
        run: pnpm --filter @framekit/docs exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @framekit/docs build
      - run: pnpm --filter @framekit/docs test:e2e
      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-e2e-${{ matrix.profile }}
          path: |
            apps/docs/artifacts/e2e-report
            apps/docs/artifacts/e2e-results
          if-no-files-found: ignore
          retention-days: 7

