name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry (for example, v0.1.3)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  packages: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.requested-tag.outputs.tag || steps.existing-tag.outputs.tag || steps.run-tagpr.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TAGPR_TOKEN }}
          persist-credentials: false

      - id: requested-tag
        name: Resolve requested release tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_TAG}" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git check-ref-format "refs/tags/${REQUESTED_TAG}" \
            || ! git rev-parse --verify --quiet "refs/tags/${REQUESTED_TAG}^{commit}" >/dev/null; then
            echo "Requested release tag does not exist: ${REQUESTED_TAG}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${REQUESTED_TAG}^{commit}" origin/main; then
            echo "Requested release tag is not reachable from main: ${REQUESTED_TAG}" >&2
            exit 1
          fi
          echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"

      - id: existing-tag
        name: Detect release tag on HEAD
        if: steps.requested-tag.outputs.tag == ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag --points-at HEAD --list 'v*')
          if (( ${#tags[@]} > 1 )); then
            echo "Multiple release tags point to HEAD" >&2
            exit 1
          fi
          tag="${tags[0]-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - id: run-tagpr
        name: Run tagpr
        if: steps.requested-tag.outputs.tag == '' && steps.existing-tag.outputs.tag == ''
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.TAGPR_TOKEN }}

  publish-npm:
    if: needs.tagpr.outputs.release-tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tagpr.outputs.release-tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Set up npm Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release package
        run: pnpm run build:package

      - name: Validate release package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        run: node scripts/validate-release-contract.mjs

      - name: Validate MCP server version
        run: node scripts/validate-mcp-server-version.mjs

      - name: Install Codex CLI for plugin validation
        run: npm install --global @openai/codex@0.144.1

      - name: Validate package and plugin alignment
        run: pnpm run test:codex-plugin

      - name: Run v0.1.6 native-editing release gate
        run: pnpm run release-gate --output-dir artifacts/release-gate/${{ github.run_id }}

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release-gate/${{ github.run_id }}
          if-no-files-found: warn

      - id: npm-status
        name: Check npm publication status
        env:
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_name="$(node -p "require('./package.json').name")"
          error_log="${RUNNER_TEMP}/npm-view-error.log"
          if published_version="$(npm view --prefer-online "${package_name}@${expected_version}" version 2>"${error_log}")"; then
            if [ "${published_version}" != "${expected_version}" ]; then
              echo "Unexpected npm version: ${published_version}" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' "${error_log}"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "${error_log}" >&2
            exit 1
          fi
      - name: Publish npm package
        if: steps.npm-status.outputs.published != 'true'
        env:
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_name="$(node -p "require('./package.json').name")"
          error_log="${RUNNER_TEMP}/npm-publish-error.log"
          if npm publish --access public 2>"${error_log}"; then
            exit 0
          fi
          cat "${error_log}" >&2
          if grep -Eq 'EPUBLISHCONFLICT|previously published versions' "${error_log}"; then
            echo "npm ${package_name}@${expected_version} was published by an earlier attempt; verification will confirm it."
            exit 0
          fi
          echo "::error::npm publish failed. For E404 or ENEEDAUTH, verify that @morshoto/framekit trusts morshoto/framekit release.yml and allows direct npm publish."
          exit 1

      - name: Verify npm publication
        env:
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_name="$(node -p "require('./package.json').name")"
          error_log="${RUNNER_TEMP}/npm-verify-error.log"
          max_attempts=6
          for attempt in $(seq 1 "${max_attempts}"); do
            if published_version="$(npm view --prefer-online "${package_name}@${expected_version}" version 2>"${error_log}")"; then
              if [ "${published_version}" != "${expected_version}" ]; then
                echo "Unexpected npm version: ${published_version}" >&2
                exit 1
              fi
              echo "Verified ${package_name}@${expected_version} on attempt ${attempt}."
              exit 0
            fi
            if ! grep -Eq 'E404|404 Not Found|No match found for version' "${error_log}"; then
              cat "${error_log}" >&2
              exit 1
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              delay=$((attempt * 5))
              echo "npm ${package_name}@${expected_version} is not visible yet; retrying in ${delay}s (attempt ${attempt}/${max_attempts})."
              sleep "${delay}"
            fi
          done
          cat "${error_log}" >&2
          exit 1

      - name: Verify native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          archive_name="FramekitFinalCutWorkflow-${expected_version}.zip"
          checksum_name="${archive_name}.sha256"
          native_dir="${RUNNER_TEMP}/framekit-native-release"
          mkdir -p "${native_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive_name}" \
            --pattern "${checksum_name}" \
            --dir "${native_dir}"
          test -s "${native_dir}/${archive_name}"
          test -s "${native_dir}/${checksum_name}"
          (
            cd "${native_dir}"
            shasum -a 256 -c "${checksum_name}"
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tagpr.outputs.release-tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft == true and (.name == \"${RELEASE_TAG}\" or .tag_name == \"${RELEASE_TAG}\")) | .id" \
            | head -n 1)"
          if [ -n "${release_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f tag_name="${RELEASE_TAG}" \
              -f name="${RELEASE_TAG}" \
              -F draft=false
          else
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
