name: PR project status

on:
    pull_request_target:
        types: [opened, reopened, edited, synchronize, closed, ready_for_review, converted_to_draft]
    pull_request_review:
        types: [submitted, edited, dismissed]
    pull_request_review_comment:
        types: [created, edited, deleted]
    workflow_run:
        workflows: [CI, CodeQL, Security]
        types: [completed]
    status:
    push:
        branches: [main]
    schedule:
        - cron: '7,22,37,52 * * * *'
    workflow_dispatch:

permissions:
    contents: read

# Every run reconciles all open PRs from current API state, so coalescing
# queued events cannot lose a transition or replay an old head's CI failure.
concurrency:
    group: project-pr-status
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check project token
              id: token
              run: |
                  if [ -z "$GH_TOKEN_FRAMEKIT_PRJ" ]; then
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::Set the GH_TOKEN_FRAMEKIT_PRJ repository secret to enable project status sync."
                  else
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GH_TOKEN_FRAMEKIT_PRJ: ${{ secrets.GH_TOKEN_FRAMEKIT_PRJ }}
            # Never execute code from a PR head with the project-write token.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: steps.token.outputs.ready == 'true'
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              if: steps.token.outputs.ready == 'true'
              with:
                  node-version: '24.22.2'
            - name: Sync linked issue statuses
              if: steps.token.outputs.ready == 'true'
              run: node scripts/sync-pr-project-status.mjs
              env:
                  FRAMEKIT_PROJECT_OWNER: morshoto
                  FRAMEKIT_PROJECT_NUMBER: '3'
                  FRAMEKIT_PROJECT_TOKEN: ${{ secrets.GH_TOKEN_FRAMEKIT_PRJ }}
                  GITHUB_API_URL: ${{ github.api_url }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
