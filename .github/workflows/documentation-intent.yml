name: Documentation intent

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: documentation-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation-intent:
    name: Documentation intent
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate changed documentation intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-documentation-intent.mjs
