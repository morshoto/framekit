name: Assign

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
    # pull_request_target:
    #     types: [opened, synchronize, reopened, edited]
    issues:
        types: [opened, reopened, closed, labeled, unlabeled]
    workflow_dispatch:

jobs:
    assign-label:
        needs: sync-labels
        if: ${{ github.event_name == 'pull_request' }}
        permissions:
            contents: read
            pull-requests: write
            issues: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Apply labels from branch
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  configuration-path: .github/labels/labeling-branch.yaml
            - name: Apply labels from changed files
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  configuration-path: .github/labels/labeling-files.yaml

    sync-labels:
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issues' && github.event.action == 'opened') }}
        permissions:
            issues: write
            contents: read
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '24.22.2'
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
            - name: Run github-label-setup
              run: pnpm dlx --yes @azu/github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels/labels.json

    sync-pull-request-milestone:
        if: >-
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
        permissions:
            contents: read
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Sync linked issue milestone
              run: node scripts/sync-pr-milestone.mjs
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_EVENT_PATH: ${{ github.event_path }}
                  GITHUB_API_URL: ${{ github.api_url }}

    sync-project-status:
        if: ${{ github.event_name == 'issues' || github.event_name == 'workflow_dispatch' }}
        permissions:
            contents: read
        concurrency:
            group: project-status-${{ github.event.issue.number || github.run_id }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check project token
              id: token
              run: |
                  if [ -z "$GH_TOKEN_FRAMEKIT_PRJ" ]; then
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::Set the GH_TOKEN_FRAMEKIT_PRJ repository secret to enable project status sync."
                  else
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GH_TOKEN_FRAMEKIT_PRJ: ${{ secrets.GH_TOKEN_FRAMEKIT_PRJ }}
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: steps.token.outputs.ready == 'true'
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              if: steps.token.outputs.ready == 'true'
              with:
                  node-version: '24.22.2'
            - name: Sync project status
              if: steps.token.outputs.ready == 'true'
              run: node scripts/sync-project-status.mjs
              env:
                  FRAMEKIT_PROJECT_OWNER: morshoto
                  FRAMEKIT_PROJECT_NUMBER: '3'
                  GH_TOKEN_FRAMEKIT_PRJ: ${{ secrets.GH_TOKEN_FRAMEKIT_PRJ }}
                  GITHUB_API_URL: ${{ github.api_url }}
                  GITHUB_EVENT_PATH: ${{ github.event_path }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

    assign-author:
        if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'issues' && github.event.action == 'opened')) && ! contains(fromJson('["renovate[bot]", "dependabot[bot]"]'), github.actor) }}
        permissions:
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1

