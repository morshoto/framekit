name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0

jobs:
  lint:
    name: Lint / static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm run build

      - name: Package boundary checks
        run: pnpm run check:boundaries

  test:
    name: Unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate clean Codex plugin installation
        run: pnpm run test:codex-plugin

      - name: Run unit and integration tests
        run: pnpm run test

      - name: Run Basic Final Cut Editing MVP gate
        if: ${{ always() }}
        run: pnpm exec tsx --test tests/integration/basic-editing-mvp.test.ts

      - name: Run deterministic MCP evaluation
        run: pnpm run evaluate

      - name: Run filler-removal benchmark
        run: pnpm run benchmark:filler-removal --output-dir artifacts/filler-removal/${{ github.run_id }}

      - name: Upload filler-removal benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filler-removal-benchmark-${{ github.run_id }}
          path: artifacts/filler-removal/${{ github.run_id }}
          if-no-files-found: warn

      - name: Run v0.1.6 native-editing release gate
        run: pnpm run release-gate --output-dir artifacts/release-gate/${{ github.run_id }}

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release-gate/${{ github.run_id }}
          if-no-files-found: warn
