name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0

jobs:
  lint:
    name: Lint / static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm run build

      - name: Package boundary checks
        run: pnpm run check:boundaries

  test:
    name: Unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.144.1

      - name: Validate clean Codex plugin installation
        run: pnpm run test:codex-plugin

      - name: Run unit and integration tests
        run: pnpm run test

      - name: Run Basic Final Cut Editing MVP gate
        if: ${{ always() }}
        run: pnpm exec tsx --test tests/integration/basic-editing-mvp.test.ts

      - name: Run deterministic MCP evaluation
        run: pnpm run evaluate

      - name: Run filler-removal benchmark
        run: pnpm run benchmark:filler-removal --output-dir artifacts/filler-removal/${{ github.run_id }}

      - name: Upload filler-removal benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filler-removal-benchmark-${{ github.run_id }}
          path: artifacts/filler-removal/${{ github.run_id }}
          if-no-files-found: warn

      - name: Run v0.0.3 release gate
        run: pnpm run release-gate --output-dir artifacts/release-gate/${{ github.run_id }}

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release-gate/${{ github.run_id }}
          if-no-files-found: warn
