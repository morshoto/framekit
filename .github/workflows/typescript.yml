name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0
  CONSUMER_NODE_VERSION: 20.0.0

jobs:
  lint:
    name: Lint / static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm run build

      - name: Package boundary checks
        run: pnpm run check:boundaries

      - name: Script references and package entrypoints
        run: pnpm run check:scripts

      - name: Toolchain consistency
        run: |
          node --test tests/documentation/toolchain-consistency.test.mjs
          node scripts/check-toolchain.mjs

      - name: Documentation structure and links
        run: pnpm run check:docs

  test:
    name: Unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg fixture toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Validate clean Codex plugin installation
        run: pnpm run test:codex-plugin

      - name: Run unit and integration tests
        env:
          FRAMEKIT_HEADLESS_RELEASE_GATE_EVIDENCE_DIR: artifacts/headless-release-gate/${{ github.run_id }}
          FRAMEKIT_HEADLESS_RELEASE_GATE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run test

      - name: Upload v0.1.15 headless release-gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-release-gate-${{ github.run_id }}
          path: artifacts/headless-release-gate/${{ github.run_id }}
          if-no-files-found: warn

      - name: Run Basic Final Cut Editing MVP gate
        if: ${{ always() }}
        run: pnpm exec tsx --test tests/integration/basic-editing-mvp.test.ts

      - name: Run deterministic MCP evaluation
        run: pnpm run evaluate

      - name: Run filler-removal benchmark
        run: pnpm run benchmark:filler-removal --output-dir artifacts/filler-removal/${{ github.run_id }}

      - name: Upload filler-removal benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: filler-removal-benchmark-${{ github.run_id }}
          path: artifacts/filler-removal/${{ github.run_id }}
          if-no-files-found: warn

      - name: Run v0.1.6 native-editing release gate
        run: pnpm run release-gate --output-dir artifacts/release-gate/${{ github.run_id }}

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release-gate/${{ github.run_id }}
          if-no-files-found: warn

  consumer-runtime:
    name: Published package consumer minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:package
      - name: Pack the built package
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.CONSUMER_NODE_VERSION }}
      - name: Install and exercise the package on the consumer minimum
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/morshoto-framekit-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/consumer-runtime-smoke.mjs" .
          node consumer-runtime-smoke.mjs
